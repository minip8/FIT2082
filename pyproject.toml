[project]
name = "fit2082"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "ipykernel>=7.3.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numba>=0.67.0",
    "numpy>=2.5.2",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "ty>=0.0.71",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
